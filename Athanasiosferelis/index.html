<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athanasios Ferelis</title>
<meta name="description" content="Athanasios Ferelis – Präsentation">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5f2ed;--stone:#cfc6b9;--ink:#1e2226;--muted:#5d6670;--gold:#b38d55;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,#e9eef0 0%,#dfe5e7 55%,#c9d2d5 55.2%,#d6dcdd 100%) fixed;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;left:0;right:0;top:55%;bottom:0;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.18) 0 2px,transparent 2px 9px)}
.stripes{position:fixed;right:6vw;top:7vh;height:22vh;display:flex;gap:1.1vw}
.stripes i{display:block;width:10px;height:100%;background:var(--ink);opacity:.85}
main{position:relative;flex:1;width:min(1080px,100%);margin:0 auto;padding:16vh 24px 40px}
h1{font-family:var(--mono);font-weight:500;font-size:clamp(40px,7vw,80px);line-height:1;letter-spacing:-.01em}
.rule{height:2px;background:var(--ink);width:min(620px,100%);margin:26px 0 22px}
.role{font-size:clamp(18px,2.2vw,24px);font-weight:600;line-height:1.35}
.role small{display:block;font-weight:400;font-size:.8em;color:var(--muted);margin-top:4px}
.choose{font-family:var(--mono);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:56px 0 16px}
.cards{display:grid;grid-template-columns:minmax(0,520px);gap:20px}
.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:rgba(245,242,237,.94);border:2px solid var(--ink);
  padding:28px 28px 24px;transition:transform .25s, box-shadow .25s, background .25s;min-height:240px}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 14px 30px rgba(30,34,38,.18);outline:none}
.card .n{font-family:var(--mono);font-size:13px;color:var(--gold)}
.card h2{font-family:var(--mono);font-weight:500;font-size:26px;margin-top:10px}
.card p{font-size:16.5px;line-height:1.5;color:var(--muted);margin-top:10px}
.card ul{list-style:none;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.card li{font-family:var(--mono);font-size:12.5px;padding:5px 9px;border:1px solid var(--stone);background:#fff}
.card .go{margin-top:auto;padding-top:22px;font-family:var(--mono);font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card .go span{transition:transform .25s}
.card:hover .go span{transform:translateX(6px)}
.card.dark{background:var(--ink);color:var(--paper)}
.card.dark p{color:#c9c4bc}.card.dark li{background:transparent;border-color:#5d646b;color:#d9d4cc}
footer{position:relative;text-align:center;font-family:var(--mono);font-size:12px;color:#3f464d;padding:18px 16px 22px}
footer a{color:inherit}
@media (max-width:760px){
  main{padding-top:14vh}
  .cards{grid-template-columns:1fr}
  .stripes{right:16px;top:20px;height:90px;gap:8px}.stripes i{width:6px}
  .card{min-height:0}
}
</style>
</head>
<body>
<div class="stripes"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<main>
  <h1>Athanasios Ferelis</h1>
  <div class="rule"></div>

  <div class="choose">Präsentation</div>
  <div class="cards">
    <a class="card dark" href="praesentation/">
      <span class="n">01</span>
      <h2>Präsentation</h2>
      <p>Die Vorstellung für das Gespräch – kompakt, mit Fokus auf Produktdaten.</p>
      <ul><li>5 Folien</li><li>Sprechnotizen</li><li>PDF</li></ul>
      <div class="go">Öffnen <span>→</span></div>
    </a>
  </div>
</main>
<footer>Athanasios Ferelis · <a href="https://ferelis.gr">ferelis.gr</a> · Version 17.10 · 16:07</footer>
</body>
</html>
