<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Veagle Cyber</title>
<meta name="description" content="Veagle OS σε λειτουργία Cyber: όλα τα links σε μια περιστρεφόμενη σφαίρα δεδομένων.">
<meta name="theme-color" content="#02060a">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#02060a;--c:#29e3ff;--m:#ff2e93;--g:#a8ff60;--dim:#5f7d8c;--line:rgba(41,227,255,.22);--acc:#29e3ff;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;--disp:'Space Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#d8f6ff;font:13px/1.4 var(--mono);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
canvas{display:block}
#rain,#sphere{position:fixed;inset:0;width:100%;height:100%}
#rain{opacity:.28}
#sphere{cursor:grab;touch-action:none}#sphere.drag{cursor:grabbing}#sphere.hot{cursor:pointer}
.scan{position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
.hud{position:fixed;z-index:10}
.top{z-index:40;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:12px max(16px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(2,6,10,.92),transparent)}
.ttl{font:700 20px var(--disp);letter-spacing:.22em;position:relative;white-space:nowrap}
.ttl i{font-style:normal;color:var(--m)}
.ttl::before,.ttl::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:.8}
.ttl::before{color:var(--m);animation:gl1 3.2s infinite steps(1);clip-path:inset(0 0 55% 0)}
.ttl::after{color:var(--c);animation:gl2 3.2s infinite steps(1);clip-path:inset(55% 0 0 0)}
@keyframes gl1{0%,92%,100%{transform:none}93%{transform:translate(-3px,0)}96%{transform:translate(2px,-1px)}}
@keyframes gl2{0%,90%,100%{transform:none}91%{transform:translate(3px,0)}95%{transform:translate(-2px,1px)}}
.sub{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.find{flex:1;max-width:420px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--line);background:rgba(2,12,18,.7);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.find svg{width:15px;height:15px;color:var(--c);flex:none}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit}
.find input::placeholder{color:var(--dim)}
.clk{font:600 18px var(--disp);letter-spacing:.1em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.clk small{display:block;font:10px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.left{left:max(14px,env(safe-area-inset-left));top:78px;bottom:70px;width:218px;display:flex;flex-direction:column;gap:6px}
.pan{border:1px solid var(--line);background:rgba(2,12,18,.62);backdrop-filter:blur(6px);position:relative}
.pan::before,.pan::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--c)}
.pan::before{left:-1px;top:-1px;border-right:0;border-bottom:0}.pan::after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.pan h2{font:600 10px var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--c);padding:8px 12px 4px}
.sectors{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.sec{padding:0 6px 6px}
.sec>button{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;text-align:left;border-left:2px solid var(--sc);background:linear-gradient(90deg,rgba(255,255,255,.04),transparent);margin-top:4px}
.sec>button:hover,.sec.on>button{background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 25%,transparent),transparent)}
.sec .n{margin-left:auto;color:var(--dim);font-size:11px}
.sec .nm{font:500 12px var(--disp);letter-spacing:.04em}
.sec ul{list-style:none;display:none;padding:2px 0 2px 12px;max-height:210px;overflow:auto}
.sec.on ul{display:block}
.sec li a{display:block;padding:3px 8px;font-size:11.5px;color:#a9cbd8;border-left:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec li a:hover{color:#fff;background:rgba(255,255,255,.05)}
.right{right:max(14px,env(safe-area-inset-right));top:78px;width:250px;display:flex;flex-direction:column;gap:10px}
.right .pan{padding-bottom:10px}
#radar{width:100%;aspect-ratio:1;max-height:230px;padding:6px 12px 0}
#ecg{width:100%;height:44px;padding:0 12px}
.gauges{display:flex;justify-content:space-around;padding:4px 6px 0}
.gg{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
.gg svg{width:64px;height:64px;display:block;margin:0 auto 2px}
.gg b{display:block;color:#fff;font:600 13px var(--disp);letter-spacing:.04em}
.wc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:0 12px;font-size:12px}
.wc span{color:var(--dim)}.wc b{font-weight:500;font-variant-numeric:tabular-nums}
#spark{width:100%;height:36px;padding:0 12px}
.bot{left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 max(14px,env(safe-area-inset-left));background:linear-gradient(0deg,rgba(2,6,10,.95),transparent)}

.ticker div{display:inline-block;animation:tk 60s linear infinite;padding-left:100%}
@keyframes tk{to{transform:translateX(-100%)}}
.ticker b{color:var(--c);font-weight:500}
.hint{font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
#tip{position:fixed;z-index:20;pointer-events:none;display:none;min-width:190px;max-width:290px;padding:10px 14px;background:rgba(2,12,18,.92);border:1px solid var(--tc,var(--c));box-shadow:0 0 24px color-mix(in srgb,var(--tc,var(--c)) 40%,transparent);clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
#tip small{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--tc,var(--c))}
#tip b{display:block;font:600 15px var(--disp);margin:2px 0}
#tip span{color:#9fc3d1;font-size:11.5px;word-break:break-all}
.boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .6s}
.boot.off{opacity:0;pointer-events:none}
.boot div{font:600 13px var(--mono);letter-spacing:.3em;color:var(--c);text-align:center}
.boot i{display:block;width:240px;height:2px;background:rgba(41,227,255,.2);margin:14px auto 0;overflow:hidden}
.boot i::after{content:"";display:block;height:100%;width:40%;background:var(--c);box-shadow:0 0 12px var(--c);animation:ld 1s infinite linear}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
@media (max-width:1100px){.right{display:none}}
@media (max-width:760px){.left{display:none}.find{max-width:none}.sub,.clk small{display:none}.ttl{font-size:15px}.top{gap:10px}.hint{display:none}.clk{font-size:14px}}

</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>

<aside class="hud left"><div class="pan sectors-wrap" style="display:flex;flex-direction:column;min-height:0;flex:1"><h2>Τομείς</h2><div class="sectors" id="sectors"></div></div></aside>

  <div class="pan"><h2>Ραντάρ</h2><canvas id="radar" width="460" height="460"></canvas></div>
  <div class="pan"><h2>Ζωτικά</h2><canvas id="ecg" width="460" height="88"></canvas>
    <div class="gauges">

    </div>
    <canvas id="spark" width="460" height="72"></canvas>
  </div>
  <div class="pan"><h2>Ώρες</h2><div class="wc" id="wc"></div></div>
</aside>

<footer class="hud bot"><div class="hint" id="hint">σύρε · ροδέλα ζουμ</div><div class="ticker"><div id="tk"></div></div></footer>
<div id="tip"></div>
<div class="boot" id="boot"><div>VEAGLE//CYBER<i></i></div></div>

/* ---------- tooltip ---------- */
var tip=$('#tip'),lastTip=null;

cv.addEventListener('pointerdown',function(e){dragging=true;moved=0;lx=e.clientX;ly=e.clientY;vel.x=vel.y=0;auto=false;cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;if(!dragging)return;var dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;rot.yaw+=dx*.006;rot.pitch+=dy*.006;vel.x=dx*.0012;vel.y=dy*.0012;tgt.yaw=rot.yaw;tgt.pitch=rot.pitch});
function up(){if(!dragging)return;dragging=false;cv.classList.remove('drag');lastIn=performance.now()}
cv.addEventListener('pointerup',function(e){var was=moved<6;up();if(was){mx=e.clientX;my=e.clientY;if(hover)ML.open(hover)}});
cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',function(){mx=my=-999});
cv.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.max(.6,Math.min(1.8,zoom*(e.deltaY<0?1.08:.92)))},{passive:false});
$('#q').addEventListener('input',function(){query=ML.norm(this.value.trim());if(query)auto=false;else lastIn=performance.now()});
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter'){var m=items.filter(function(i){return i._m});if(m.length&&query)ML.open(m[0])}if(e.key==='Escape'){this.value='';query='';this.blur()}});

/* ---------- βροχή δεδομένων ---------- */
var rain=$('#rain'),rx=rain.getContext('2d'),cols=0,drops=[],CH='01ΦΕΡΕΛΗΣVEAGLE<>/{}[]#$π=+*アイウエオ';
function drawRain(){rx.fillStyle='rgba(2,6,10,.14)';rx.fillRect(0,0,W,H);rx.font='14px IBM Plex Mono,monospace';for(var i=0;i<cols;i++){var y=drops[i]*16;rx.fillStyle=Math.random()<.04?'#fff':'#29e3ff';rx.fillText(CH[(Math.random()*CH.length)|0],i*16,y);if(y>H&&Math.random()>.975)drops[i]=0;drops[i]+=.35}}

/* ---------- ραντάρ ---------- */
var rd=$('#radar'),rc=rd.getContext('2d'),blips=items.map(function(it){var h=0,s=it.id+it.name;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return{a:(h%3600)/3600*6.2832,r:.2+((h>>8)%1000)/1000*.75,c:it.fc,lit:0}});
function drawRadar(t){
  var S=460,c=S/2;rc.clearRect(0,0,S,S);rc.strokeStyle='rgba(41,227,255,.35)';rc.lineWidth=2;
  for(var i=1;i<=4;i++){rc.beginPath();rc.arc(c,c,c*.92*i/4,0,6.3);rc.stroke()}
  rc.beginPath();rc.moveTo(c,8);rc.lineTo(c,S-8);rc.moveTo(8,c);rc.lineTo(S-8,c);rc.stroke();
  var sw=(t*1.2)%6.2832,gr=rc.createConicGradient?rc.createConicGradient(sw-1.4,c,c):null;
  if(gr){gr.addColorStop(0,'rgba(41,227,255,0)');gr.addColorStop(.22,'rgba(41,227,255,.38)');gr.addColorStop(.2201,'rgba(41,227,255,0)');rc.fillStyle=gr;rc.beginPath();rc.arc(c,c,c*.92,0,6.3);rc.fill()}
  rc.strokeStyle='#29e3ff';rc.lineWidth=3;rc.beginPath();rc.moveTo(c,c);rc.lineTo(c+Math.cos(sw)*c*.92,c+Math.sin(sw)*c*.92);rc.stroke();
  blips.forEach(function(b){var d=((sw-b.a)%6.2832+6.2832)%6.2832;if(d<.08)b.lit=1;b.lit*=.985;rc.globalAlpha=.25+b.lit*.75;rc.fillStyle=b.c;rc.shadowColor=b.c;rc.shadowBlur=b.lit*14;rc.beginPath();rc.arc(c+Math.cos(b.a)*b.r*c*.92,c+Math.sin(b.a)*b.r*c*.92,3+b.lit*4,0,6.3);rc.fill();rc.shadowBlur=0});rc.globalAlpha=1;
}
/* ---------- ECG ---------- */
var ec=$('#ecg').getContext('2d'),ebuf=new Array(230).fill(0),eh=0,et=0;
function g(p,m,s){return Math.exp(-Math.pow(p-m,2)/(2*s*s))}function ecgf(p){return .12*g(p,.12,.025)-.1*g(p,.205,.008)+g(p,.235,.009)-.22*g(p,.265,.01)+.25*g(p,.42,.04)}
function drawEcg(){et+=1/60;ebuf[eh]=ecgf((et*1.1)%1);eh=(eh+1)%230;ec.clearRect(0,0,460,88);ec.strokeStyle='#a8ff60';ec.lineWidth=2.4;ec.shadowColor='#a8ff60';ec.shadowBlur=8;ec.beginPath();for(var i=0;i<230;i++){var v=ebuf[(eh+i)%230],y=66-v*56;if(i===0)ec.moveTo(0,y);else ec.lineTo(i*2,y)}ec.stroke();ec.shadowBlur=0}
/* ---------- δείκτες ---------- */
function gauge(id,pct,col){var s=$(id),r=26,c=2*Math.PI*r;s.innerHTML='<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="5"/><circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(c*pct)+' '+c+'" transform="rotate(-90 32 32)" style="filter:drop-shadow(0 0 4px '+col+')"/>'}
var pings=[];
var NET=false;try{NET=!!(JSON.parse(localStorage.getItem('veagleos.settings.v1')||'{}')||{}).net}catch(e){}
function ping(){if(!NET){$('#v1').textContent='τοπικά';return}var t=performance.now();fetch('https://www.google.com/generate_204?_='+Date.now(),{mode:'no-cors',cache:'no-store'}).then(function(){var ms=Math.round(performance.now()-t);pings.push(ms);if(pings.length>40)pings.shift();$('#v1').textContent=ms+'ms';gauge('#g1',Math.max(.05,1-Math.min(ms,600)/600),'#29e3ff');spark()}).catch(function(){$('#v1').textContent='--';gauge('#g1',0,'#ff2e93')})}
function spark(){var s=$('#spark').getContext('2d');s.clearRect(0,0,460,72);if(pings.length<2)return;var mx2=Math.max.apply(null,pings)*1.2,n=pings.length;s.strokeStyle='#29e3ff';s.lineWidth=2.4;s.beginPath();pings.forEach(function(v,i){var x=i/(40-1)*460,y=66-v/mx2*60;if(i===0)s.moveTo(x,y);else s.lineTo(x,y)});s.stroke()}
gauge('#g1',0,'#29e3ff');gauge('#g2',0,'#a8ff60');gauge('#g3',1,'#ff2e93');$('#v3').textContent=N;
if(navigator.getBattery)navigator.getBattery().then(function(b){function u(){$('#v2').textContent=Math.round(b.level*100)+'%';gauge('#g2',b.level,'#a8ff60')}u();b.addEventListener('levelchange',u)}).catch(function(){});
ping();setInterval(ping,10000);
/* ---------- ρολόι και ώρες ---------- */

zones.forEach(function(z){var a=document.createElement('span');a.textContent=z[0];var b=document.createElement('b');z.push(b);wc.appendChild(a);wc.appendChild(b)});

tick();setInterval(tick,1000);

addEventListener('resize',resize);resize();
