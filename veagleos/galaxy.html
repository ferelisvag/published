<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Veagle Galaxy</title>
<meta name="description" content="Veagle OS σε λειτουργία Galaxy: οι φάκελοι είναι πλανήτες και τα links φεγγάρια.">
<meta name="theme-color" content="#04030c">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--bg:#04030c;--acc:#ffb86b;--dim:#8d86b0;--disp:'Space Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:#efeaff;font:14px/1.45 var(--disp);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#gx{position:fixed;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}#gx.hot{cursor:pointer}
.top{position:fixed;z-index:40;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:14px max(18px,env(safe-area-inset-left));background:linear-gradient(180deg,rgba(4,3,12,.85),transparent);pointer-events:none}
.top>*{pointer-events:auto}
.ttl{font:700 20px var(--disp);letter-spacing:.3em;white-space:nowrap;background:linear-gradient(90deg,#ffe3a8,#ff9ed0,#9ec5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font:10px var(--mono);letter-spacing:.3em;color:var(--dim);text-transform:uppercase;margin-top:2px}
.find{flex:1;max-width:380px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:7px 16px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(10,8,30,.6);backdrop-filter:blur(8px)}
.find svg{width:15px;height:15px;color:var(--acc);flex:none}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font:inherit}.find input::placeholder{color:var(--dim)}
.clk{font:600 18px var(--disp);letter-spacing:.08em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.clk small{display:block;font:10px var(--mono);letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
.dock{position:fixed;z-index:10;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:6px;padding:7px;max-width:calc(100% - 20px);overflow-x:auto;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(10,8,30,.6);backdrop-filter:blur(10px)}
.dock button{flex:none;display:flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;font:500 12px var(--disp);white-space:nowrap;color:#d9d3f5}
.dock button i{width:9px;height:9px;border-radius:50%;background:var(--pc);box-shadow:0 0 10px var(--pc)}
.dock button:hover,.dock button.on{background:rgba(255,255,255,.1);color:#fff}
.card{position:fixed;z-index:10;left:max(18px,env(safe-area-inset-left));top:84px;width:280px;max-height:calc(100% - 190px);display:none;flex-direction:column;border:1px solid color-mix(in srgb,var(--pc) 55%,transparent);border-radius:16px;background:rgba(10,8,30,.72);backdrop-filter:blur(12px);box-shadow:0 0 40px color-mix(in srgb,var(--pc) 25%,transparent);overflow:hidden}
.card.on{display:flex}
.card header{padding:14px 16px 8px}
.card small{font:10px var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--pc)}
.card h2{font:700 22px var(--disp);margin:2px 0}
.card p{color:var(--dim);font-size:12.5px}
.card ul{list-style:none;overflow:auto;padding:4px 8px 10px}
.card li a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:8px;font-size:13px}
.card li a::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pc);flex:none}
.card li a:hover{background:rgba(255,255,255,.08)}
.card .back{margin:0 16px 8px;align-self:flex-start;font:600 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:4px 12px}
.card .back:hover{color:#fff;border-color:#fff}
#tip{position:fixed;z-index:20;pointer-events:none;display:none;padding:8px 12px;border-radius:10px;background:rgba(10,8,30,.92);border:1px solid var(--tc,#fff);box-shadow:0 0 22px color-mix(in srgb,var(--tc,#fff) 40%,transparent);max-width:280px}
#tip small{display:block;font:10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--tc)}#tip b{display:block;font:600 14px var(--disp)}#tip span{font-size:12px;color:#b5aedb;word-break:break-all}
.hint{position:fixed;z-index:9;right:max(18px,env(safe-area-inset-right));bottom:72px;font:10px var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);text-align:right;pointer-events:none}
.boot{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;transition:opacity .8s}.boot.off{opacity:0;pointer-events:none}
.boot b{font:700 14px var(--disp);letter-spacing:.5em;color:#ffe3a8;animation:pl 1.4s infinite}@keyframes pl{50%{opacity:.35}}
@media (max-width:820px){.card{top:auto;bottom:70px;left:10px;right:10px;width:auto;max-height:42%}.sub,.clk small,.hint{display:none}.ttl{font-size:15px}.clk{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="gx" aria-label="Ηλιακό σύστημα με τους φακέλους ως πλανήτες. Πάτα έναν πλανήτη για να δεις τα φεγγάρια του."></canvas>
<header class="top">
  <div><div class="ttl">VEAGLE GALAXY</div><div class="sub">There’s always another way.</div></div>
  <label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" type="text" placeholder="Αναζήτηση στο σύμπαν…  ( / )" autocomplete="off" spellcheck="false" aria-label="Αναζήτηση"></label>
  <div id="mb"></div>
  <div class="clk"><span id="clk"></span><small id="date"></small></div>
</header>
<aside class="card" id="card"><header><small id="cs"></small><h2 id="ch"></h2><p id="cp"></p></header><button class="back" id="back" type="button">‹ Όλο το σύστημα</button><ul id="cl"></ul></aside>
<div class="hint">σύρε · ροδέλα ζουμ · πάτα πλανήτη</div>
<nav class="dock" id="dock" aria-label="Πλανήτες"></nav>
<div id="tip"></div>
<div class="boot" id="boot"><b>GALAXY</b></div>

<script src="js/catalog.js"></script>
<script src="js/i18n.js"></script>
<script src="js/linkhub.js"></script>
<script src="js/modelib.js"></script>
<script>
(function(){
'use strict';
var ML=window.ML,RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(s){return document.querySelector(s)}
$('#mb').appendChild(ML.modeBar('galaxy'));
document.documentElement.style.setProperty('--acc','#ffb86b');
var cv=$('#gx'),ctx=cv.getContext('2d'),W=0,H=0,dpr=1;
var folders=ML.folders.map(function(f){f.list=f.items.concat(f.also);return f}).filter(function(f){return f.list.length});
var sun=new Image();sun.src='images/eagle-white.png';
var rnd=function(a,b){return a+Math.random()*(b-a)};
/* πλανήτες */
var TILT=-.22,ct=Math.cos(TILT),st=Math.sin(TILT);
var planets=folders.map(function(f,i){
  var rx=170+i*78,n=f.list.length;
  var p={f:f,i:i,rx:rx,ry:rx*.4,a:rnd(0,6.28),sp:.22/Math.sqrt(rx/100)*.5,r:Math.min(30,13+Math.sqrt(n)*2.8),c:f.color,ring:i%3===1,x:0,y:0};
  /* φεγγάρια: δακτύλιοι των ~14 */
  var cap=14,rings=Math.ceil(n/cap);p.moons=f.list.map(function(it,k){var ri=Math.floor(k/Math.ceil(n/rings)),per=Math.ceil(n/rings),idx=k%per,cnt=Math.min(per,n-ri*per);return{it:it,ring:ri,a:idx/cnt*6.28+ri,sp:(.35-ri*.06)*(ri%2?-1:1),x:0,y:0}});
  p.mr=function(ri){return p.r*2.3+ri*p.r*.95+(rings>2?4:0)};
  p.outer=p.mr(rings-1)+8;
  return p;
});
var maxRx=planets[planets.length-1].rx;
/* αστέρια, νεφελώματα, ζώνη αστεροειδών */
var stars=[];[0.15,0.3,0.6].forEach(function(d,l){for(var i=0;i<140;i++)stars.push({x:rnd(-2000,2000),y:rnd(-1400,1400),r:rnd(.4,1.4)*(l+1)*.6,d:d,p:rnd(0,6.3),c:Math.random()<.2?'#ffd6a8':(Math.random()<.3?'#a8c8ff':'#fff')})});
var neb=[];for(var i=0;i<7;i++)neb.push({x:rnd(-1200,1200),y:rnd(-800,800),r:rnd(380,760),c:['rgba(120,60,200,','rgba(30,90,200,','rgba(200,50,110,','rgba(20,150,170,'][i%4],d:.08+Math.random()*.1});
var belt=[];for(var i=0;i<420;i++)belt.push({a:rnd(0,6.28),r:rnd(0,1),s:rnd(.4,1.6),w:rnd(.02,.05)});
var comets=[];
/* κάμερα */
var cam={x:0,y:0,z:1},ct2={x:0,y:0,z:1},focus=null,query='',hoverP=null,hoverM=null,mx=-9,my=-9;
function fitZ(){return Math.min(W/(maxRx*2.25),H/(maxRx*.4*2*2.2+160))}
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!focus){ct2.z=fitZ();cam.z=ct2.z}}
function toS(x,y){return[W/2+(x-cam.x)*cam.z,H/2+(y-cam.y)*cam.z]}
function setFocus(p){
  focus=p;
  document.querySelectorAll('#dock button').forEach(function(b){b.classList.toggle('on',p&&b.dataset.id===p.f.id)});
  var c=$('#card');
  if(!p){c.classList.remove('on');ct2.x=0;ct2.y=0;ct2.z=fitZ();return}
  c.style.setProperty('--pc',p.c);c.classList.add('on');$('#cs').textContent=p.f.list.length+' στοιχεία';$('#ch').textContent=p.f.name;$('#cp').textContent=p.f.desc;
  var ul=$('#cl');ul.textContent='';p.f.list.forEach(function(it){var li=document.createElement('li'),a=document.createElement('a');a.href=it.href;if(it.ext){a.target='_blank';a.rel='noopener noreferrer'}a.textContent=it.name;li.appendChild(a);ul.appendChild(li)});
  var narrow=W<820;ct2.z=Math.min(W*(narrow?.42:.3),H*.36)/p.outer;
}
/* dock */
var dock=$('#dock');planets.forEach(function(p){var b=document.createElement('button');b.type='button';b.dataset.id=p.f.id;b.style.setProperty('--pc',p.c);b.innerHTML='<i></i><span></span>';b.querySelector('span').textContent=p.f.name;b.addEventListener('click',function(){setFocus(focus===p?null:p)});dock.appendChild(b)});
$('#back').addEventListener('click',function(){setFocus(null)});
/* σχεδίαση πλανήτη */
function drawPlanet(p,sx,sy,r,alpha,t){
  ctx.globalAlpha=alpha;
  var gl=ctx.createRadialGradient(sx,sy,r*.8,sx,sy,r*2.6);gl.addColorStop(0,p.c+'55');gl.addColorStop(1,p.c+'00');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(sx,sy,r*2.6,0,6.3);ctx.fill();
  if(p.ring){ctx.strokeStyle=p.c+'aa';ctx.lineWidth=Math.max(1,r*.18);ctx.beginPath();ctx.ellipse(sx,sy,r*1.9,r*.55,-.35,Math.PI,6.28);ctx.stroke()}
  var g=ctx.createRadialGradient(sx-r*.4,sy-r*.45,r*.1,sx,sy,r);g.addColorStop(0,'#fff');g.addColorStop(.22,p.c);g.addColorStop(1,'#05030f');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(sx,sy,r,0,6.3);ctx.fill();
  /* ζώνες στην επιφάνεια */
  ctx.save();ctx.beginPath();ctx.arc(sx,sy,r,0,6.3);ctx.clip();ctx.globalAlpha=alpha*.18;ctx.fillStyle='#000';for(var k=-2;k<=2;k++){ctx.fillRect(sx-r,sy+k*r*.38+Math.sin(t*.3+p.i)*r*.05,r*2,r*.1)}ctx.restore();
  if(p.ring){ctx.globalAlpha=alpha;ctx.strokeStyle=p.c+'cc';ctx.lineWidth=Math.max(1,r*.18);ctx.beginPath();ctx.ellipse(sx,sy,r*1.9,r*.55,-.35,0,Math.PI);ctx.stroke()}
  ctx.globalAlpha=1;
}
var t0=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var t=(now-t0)/1000;
  /* θέσεις */
  planets.forEach(function(p){if(!RM)p.a+=p.sp*.004*(focus===p?.25:1);var x=Math.cos(p.a)*p.rx,y=Math.sin(p.a)*p.ry;p.x=x*ct-y*st;p.y=x*st+y*ct});
  if(focus){ct2.x=focus.x;ct2.y=focus.y}
  cam.x+=(ct2.x-cam.x)*.07;cam.y+=(ct2.y-cam.y)*.07;cam.z+=(ct2.z-cam.z)*.07;
  /* φόντο */
  ctx.clearRect(0,0,W,H);var bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);bg.addColorStop(0,'#120a28');bg.addColorStop(1,'#03020a');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  neb.forEach(function(n){var x=W/2+(n.x-cam.x*n.d*3)*Math.max(.6,cam.z*.6),y=H/2+(n.y-cam.y*n.d*3)*Math.max(.6,cam.z*.6),r=n.r*Math.max(.6,cam.z*.7);var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,n.c+'.16)');g.addColorStop(1,n.c+'0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)});
  stars.forEach(function(s){var x=((W/2+(s.x-cam.x*s.d)*(.6+cam.z*.4))%(W+40)+W+40)%(W+40)-20,y=((H/2+(s.y-cam.y*s.d)*(.6+cam.z*.4))%(H+40)+H+40)%(H+40)-20;ctx.globalAlpha=.45+.45*Math.sin(t*1.3+s.p);ctx.fillStyle=s.c;ctx.fillRect(x,y,s.r,s.r)});
  ctx.globalAlpha=1;
  /* τροχιές */
  var dim=focus?.25:1;
  planets.forEach(function(p){ctx.strokeStyle=p.c;ctx.globalAlpha=(focus===p?.5:.16)*(focus&&focus!==p?.5:1);ctx.lineWidth=1;ctx.beginPath();var c0=toS(0,0);ctx.ellipse(c0[0],c0[1],p.rx*cam.z,p.ry*cam.z,TILT,0,6.3);ctx.stroke()});
  ctx.globalAlpha=1;
  /* ζώνη αστεροειδών ανάμεσα στον 3ο και 4ο πλανήτη */
  if(planets.length>4){var br=(planets[3].rx+planets[4].rx)/2;ctx.fillStyle='#b9a98f';belt.forEach(function(b){var a=b.a+(RM?0:t*b.w*.2),rr=br+(b.r-.5)*34,x=Math.cos(a)*rr,y=Math.sin(a)*rr*.4,X=x*ct-y*st,Y=x*st+y*ct,s=toS(X,Y);ctx.globalAlpha=.55*dim+.1;ctx.fillRect(s[0],s[1],b.s*Math.max(.7,cam.z),b.s*Math.max(.7,cam.z))});ctx.globalAlpha=1}
  /* ήλιος */
  var sc=toS(0,0),sr=46*cam.z,pu=1+Math.sin(t*2.1)*.04;
  var sg=ctx.createRadialGradient(sc[0],sc[1],sr*.2,sc[0],sc[1],sr*4.2);sg.addColorStop(0,'rgba(255,200,110,.75)');sg.addColorStop(.25,'rgba(255,120,60,.28)');sg.addColorStop(1,'rgba(255,90,40,0)');ctx.globalAlpha=focus?.5:1;ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sc[0],sc[1],sr*4.2*pu,0,6.3);ctx.fill();
  var sg2=ctx.createRadialGradient(sc[0]-sr*.2,sc[1]-sr*.2,sr*.1,sc[0],sc[1],sr);sg2.addColorStop(0,'#fff7d6');sg2.addColorStop(.5,'#ffb347');sg2.addColorStop(1,'#e8531c');ctx.fillStyle=sg2;ctx.beginPath();ctx.arc(sc[0],sc[1],sr*pu,0,6.3);ctx.fill();
  if(sun.complete&&sun.naturalWidth){var iw=sr*1.15,ih=iw*sun.naturalHeight/sun.naturalWidth;ctx.globalAlpha=(focus?.5:1)*.9;ctx.drawImage(sun,sc[0]-iw/2,sc[1]-ih/2,iw,ih)}
  ctx.globalAlpha=1;
  /* κομήτες */
  if(!RM&&Math.random()<.004&&comets.length<2)comets.push({x:rnd(-1.2,-.6)*maxRx,y:rnd(-.6,.6)*maxRx*.5,vx:rnd(3,6),vy:rnd(.8,2.2),l:0});
  comets.forEach(function(c){c.x+=c.vx;c.y+=c.vy;c.l++;var s=toS(c.x,c.y),tl=toS(c.x-c.vx*18,c.y-c.vy*18),g=ctx.createLinearGradient(s[0],s[1],tl[0],tl[1]);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(160,200,255,0)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(tl[0],tl[1]);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s[0],s[1],2.4,0,6.3);ctx.fill()});
  comets=comets.filter(function(c){return c.l<400});
  /* πλανήτες (πίσω → μπρος κατά y) */
  hoverP=null;hoverM=null;var bestD=1e9;
  var q=query,hasQ=!!q;
  planets.slice().sort(function(a,b){return a.y-b.y}).forEach(function(p){
    var s=toS(p.x,p.y),r=p.r*cam.z,al=focus&&focus!==p?.22:1,match=hasQ&&p.moons.some(function(m){return m.m});
    drawPlanet(p,s[0],s[1],r,al,t);
    if(match){ctx.strokeStyle='#fff';ctx.globalAlpha=.8;ctx.lineWidth=2;ctx.beginPath();ctx.arc(s[0],s[1],r*1.5+Math.sin(t*5)*3,0,6.3);ctx.stroke();ctx.globalAlpha=1}
    var d=(s[0]-mx)*(s[0]-mx)+(s[1]-my)*(s[1]-my);if(!focus&&d<Math.pow(Math.max(r*1.5,16),2)&&d<bestD){bestD=d;hoverP=p}
    if(!focus||focus===p){ctx.globalAlpha=al;ctx.fillStyle='#fff';ctx.font='600 '+Math.max(11,Math.min(15,r*.7))+'px Space Grotesk,sans-serif';ctx.textAlign='center';if(focus!==p)ctx.fillText(p.f.name,s[0],s[1]+r+16+(p.ring?r*.3:0));ctx.textAlign='left';ctx.globalAlpha=1}
    /* φεγγάρια */
    if(focus===p){
      p.moons.forEach(function(m){m.it._m=!hasQ||ML.norm(m.it.name+' '+m.it.desc+' '+m.it.section).indexOf(q)>=0;m.m=m.it._m});
      var rings={};p.moons.forEach(function(m){rings[m.ring]=1});
      Object.keys(rings).forEach(function(ri){ctx.strokeStyle=p.c;ctx.globalAlpha=.22;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(s[0],s[1],p.mr(+ri)*cam.z,p.mr(+ri)*cam.z*.62,0,0,6.3);ctx.stroke()});
      ctx.globalAlpha=1;
      var many=p.moons.length>24;
      p.moons.forEach(function(m){
        if(!RM)m.a+=m.sp*.004;var rr=p.mr(m.ring)*cam.z,x=s[0]+Math.cos(m.a)*rr,y=s[1]+Math.sin(m.a)*rr*.62,mr=Math.max(4,cam.z*3.4);m.x=x;m.y=y;
        var on=m.m,d2=(x-mx)*(x-mx)+(y-my)*(y-my);if(d2<bestD&&d2<22*22){bestD=d2;hoverM=m}
        ctx.globalAlpha=on?1:.2;var g=ctx.createRadialGradient(x-mr*.3,y-mr*.3,1,x,y,mr);g.addColorStop(0,'#fff');g.addColorStop(.35,p.c);g.addColorStop(1,'#10081f');ctx.fillStyle=g;ctx.shadowColor=p.c;ctx.shadowBlur=on?12:0;ctx.beginPath();ctx.arc(x,y,mr*(m===hoverM?1.5:1),0,6.3);ctx.fill();ctx.shadowBlur=0;
        if(on&&(!many||m===hoverM||hasQ)){ctx.globalAlpha=1;ctx.font='500 12px Space Grotesk,sans-serif';var tw=ctx.measureText(m.it.name).width;ctx.fillStyle='rgba(10,8,30,.78)';ctx.fillRect(x+mr+4,y-9,tw+10,18);ctx.fillStyle='#fff';ctx.fillText(m.it.name,x+mr+9,y+4)}
      });
      ctx.globalAlpha=1;
    }
  });
  cv.classList.toggle('hot',!!(hoverP||hoverM));
  showTip();
}
var tip=$('#tip'),lt=null;
function showTip(){
  var h=hoverM?hoverM.it:hoverP;if(!h||drag){tip.style.display='none';lt=null;return}
  if(lt!==h){lt=h;var c=hoverM?hoverM.it.fc:hoverP.c;tip.style.setProperty('--tc',c);tip.innerHTML='<small></small><b></b><span></span>';if(hoverM){tip.children[0].textContent=hoverM.it.f.name;tip.children[1].textContent=hoverM.it.name;tip.children[2].textContent=hoverM.it.desc||hoverM.it.href}else{tip.children[0].textContent=hoverP.f.list.length+' στοιχεία';tip.children[1].textContent=hoverP.f.name;tip.children[2].textContent=hoverP.f.desc}}
  tip.style.display='block';tip.style.left=Math.min(W-tip.offsetWidth-10,mx+16)+'px';tip.style.top=Math.max(60,Math.min(H-tip.offsetHeight-10,my+14))+'px';
}
/* είσοδος */

cv.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;if(!drag)return;var dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);lx=e.clientX;ly=e.clientY;if(!focus){ct2.x-=dx/cam.z;ct2.y-=dy/cam.z;cam.x=ct2.x;cam.y=ct2.y}});
cv.addEventListener('pointerup',function(e){var click=moved<6;drag=false;if(!click)return;mx=e.clientX;my=e.clientY;
  if(hoverM)ML.open(hoverM.it);else if(hoverP)setFocus(hoverP);else if(focus){var sc=toS(focus.x,focus.y);setFocus(null)}});
cv.addEventListener('pointercancel',function(){drag=false});
cv.addEventListener('pointerleave',function(){mx=my=-9});
cv.addEventListener('wheel',function(e){e.preventDefault();ct2.z=Math.max(fitZ()*.5,Math.min(5,ct2.z*(e.deltaY<0?1.12:.9)))},{passive:false});
