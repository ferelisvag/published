<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Veagle Wall</title>
<meta name="description" content="Veagle OS σε λειτουργία Wall: control room με οθόνες.">
<meta name="theme-color" content="#05070a">
<link rel="icon" type="image/png" sizes="32x32" href="images/icon-32.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#05070a;color:#eef2f8;font:14px/1.45 'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc,#fff);outline-offset:2px}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}canvas#cv.hot{cursor:pointer}canvas#cv.drag{cursor:grabbing}


#wall{position:fixed;inset:0;overflow:auto;padding:84px 18px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));grid-auto-rows:minmax(150px,auto);gap:14px;align-content:start;background:radial-gradient(ellipse at 50% 0,#0e1826,#04060a 70%)}
.tl{position:relative;display:flex;flex-direction:column;min-height:190px;max-height:360px;border:1px solid #1c2a3a;border-radius:12px;background:linear-gradient(180deg,#0a111b,#070b12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03),0 10px 30px rgba(0,0,0,.5);overflow:hidden}
.tl::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.tl.big{grid-column:span 2;max-height:none}
.th{display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid #162232;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.2em;text-transform:uppercase;color:var(--c,#8ab)}
.th i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:led 2.4s infinite}
@keyframes led{50%{opacity:.35}}
.th span{margin-left:auto;color:#5b6b80;font-size:10px}
.tl canvas{display:block;width:100%;height:46px;flex:none}
.tl ul{list-style:none;overflow:auto;padding:4px 8px 10px;flex:1}
.tl li a{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:7px;font-size:13px;color:#cfd9e8}
.tl li a::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);flex:none}
.tl li a:hover{background:rgba(255,255,255,.07);color:#fff}
.tl li small{margin-left:auto;color:#5b6b80;font:10px 'IBM Plex Mono',monospace;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl.hide{opacity:.15}
.bigclk{font:700 clamp(44px,6vw,84px)/1 'Space Grotesk',sans-serif;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-align:center;padding:22px 10px 4px;text-shadow:0 0 30px rgba(120,200,255,.35)}
.bigclk small{font-size:.35em;color:#ff4d6d;margin-left:6px}
.bigdate{text-align:center;color:#8fa1b8;padding-bottom:16px;font-size:14px}
.cd{display:flex;justify-content:center;gap:16px;padding:20px 8px 6px;font:700 40px 'Space Grotesk',sans-serif;font-variant-numeric:tabular-nums}
.cd div{text-align:center}.cd small{display:block;font:10px 'IBM Plex Mono',monospace;letter-spacing:.18em;color:#ff5fb0;text-transform:uppercase}
.cdt{text-align:center;color:#ff5fb0;font:600 12px 'IBM Plex Mono',monospace;letter-spacing:.24em;padding-bottom:14px}
.kv{padding:12px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:13px 'IBM Plex Mono',monospace}.kv span{color:#6f8196}.kv b{font-weight:500;text-align:right}
.wxbig{font:700 54px/1 'Space Grotesk',sans-serif;padding:14px 16px 0}
@media (max-width:640px){#wall{grid-template-columns:1fr;padding-top:70px}.tl.big{grid-column:auto}}
</style>
</head>
<body>
<div id="wall"></div>
<script src="js/catalog.js"></script>
<script src="js/i18n.js"></script>
<script src="js/linkhub.js"></script>
<script src="js/modelib.js"></script>
<script src="js/m-wall.js"></script>
</body>
</html>
